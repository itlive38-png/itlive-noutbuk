<!DOCTYPE html>
<!--build:2026112603-->
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IT Live Kutubxonasi</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/kitoblar.webmanifest">
<link rel="icon" href="/book-192.png">
<link rel="apple-touch-icon" href="/book-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IT Live Kutubxona">
<style>
:root{--bg:#f5f6f4;--card:#fff;--tx:#1b1f1d;--mut:#667069;--bd:#e1e5e2;--pri:#0f766e;--okb:#dcf5e8;--okt:#0c6b3e;--wab:#fdecc8;--wat:#8a5a00;--sh:0 1px 3px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1311;--card:#171d1a;--tx:#e8ece9;--mut:#9aa59f;--bd:#27302b;--pri:#2dd4bf;--okb:#12382a;--okt:#6ee7a8;--wab:#3b2e0c;--wat:#f5c451;--sh:none}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 40px}
header{padding:22px 0 8px}h1{margin:0;font-size:26px;letter-spacing:-.3px}.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{font-size:12.5px;color:var(--mut)}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:grid;gap:8px}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:9px 16px;font:600 14px system-ui;min-height:40px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){.chip.on{color:#05211d}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:6px}
.bk{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;text-align:left}
.bk:active{transform:scale(.99)}.bk h3{margin:0;font-size:17px;line-height:1.3}.au{margin:0;color:var(--mut);font-size:14.5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font:600 12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
.st{font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.st.free{background:var(--okb);color:var(--okt)}.st.out{background:var(--wab);color:var(--wat)}
.mt{font-size:13px;color:var(--mut)}
.empty,#msg{text-align:center;color:var(--mut);padding:30px 10px}
#msg button{font:inherit;margin-left:6px;padding:6px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--tx);padding:20px;width:min(520px,94vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:6px 0 2px;font-size:22px;line-height:1.25}dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:15px}dt{color:var(--mut)}dd{margin:0}
.close{width:100%;margin-top:8px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:700 16px system-ui;padding:13px;min-height:48px;cursor:pointer}
@media(prefers-color-scheme:dark){.close{color:#05211d}}
@media(max-width:640px){dialog{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:20px 20px 0 0}}
footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:24px}footer button{font:inherit;background:none;border:0;color:var(--pri);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
<header><h1 id="ttl">📚 IT Live Kutubxonasi</h1><p class="sub">Kitoblar katalogi · qaysi kitob javonda, qaysi biri berilgan</p></header>
<div class="stats"><div class="stat"><b id="n1">–</b><span>Jami kitob</span></div><div class="stat"><b id="n2" style="color:var(--okt)">–</b><span>Javonda</span></div><div class="stat"><b id="n3" style="color:var(--wat)">–</b><span>Berilgan</span></div></div>
<div class="tools">
<input id="q" type="search" placeholder="🔍 Kitob nomi, muallif yoki janr…" autocomplete="off">
<div class="chips" id="chips"><button class="chip on" data-s="all">Hammasi</button><button class="chip" data-s="free">Javonda</button><button class="chip" data-s="out">Berilgan</button></div>
<div class="row"><select id="cat"><option value="">Barcha janrlar</option></select><select id="srt"><option value="code">Tartib: kod</option><option value="title">Nomi (A–Z)</option><option value="author">Muallif (A–Z)</option><option value="free">Javondagilar oldin</option><option value="new">Yangi qo‘shilgan</option></select></div>
</div>
<div id="msg">Yuklanmoqda…</div>
<div class="grid" id="list"></div>
<footer><div style="margin-bottom:4px">IT Live Kutubxonasi · onlayn katalog</div><span id="upd"></span> <button onclick="load()">Yangilash</button></footer>
</div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nrm=s=>String(s||'').toLowerCase().replace(/[ʻʼ‘’'`]/g,'');
const fd=d=>d?d.split('-').reverse().join('.'):'';
const tdy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dueTx=b=>!b.due?'':b.due>=tdy()?'Qaytishi kutilmoqda: <b>'+fd(b.due)+'</b>':'Qaytish sanasi aniq emas';
let D=null,F={q:'',s:'all',cat:'',sort:'code'};
async function load(){
  const slow=setTimeout(()=>{if(!D)$('#msg').textContent='Server uyg‘onmoqda… 1 daqiqagacha kutish mumkin'},6000);
  try{const r=await fetch('/api/public/books',{cache:'no-store'});if(!r.ok)throw 0;D=await r.json();$('#msg').textContent='';draw()}
  catch(e){if(!D)$('#msg').innerHTML='⚠ Yuklab bo‘lmadi. <button onclick="load()">Qayta urinish</button>'}
  clearTimeout(slow)}
function draw(){
  $('#ttl').textContent='📚 '+D.name;document.title=D.name+' — katalog';
  $('#n1').textContent=D.total;$('#n2').textContent=D.free;$('#n3').textContent=D.out;
  const cs=$('#cat'),cur=cs.value;cs.innerHTML='<option value="">Barcha janrlar</option>'+D.cats.map(c=>`<option>${esc(c)}</option>`).join('');cs.value=D.cats.includes(cur)?cur:'';F.cat=cs.value;
  const t=nrm(F.q);
  let R=D.books.filter(b=>(F.s==='all'||b.st===F.s)&&(!F.cat||b.cat===F.cat)&&(!t||nrm(b.t+' '+b.a+' '+b.cat+' '+b.c+' '+b.s).includes(t)));
  const cmp={code:(a,b)=>a.c.localeCompare(b.c),title:(a,b)=>a.t.localeCompare(b.t,'uz'),author:(a,b)=>a.a.localeCompare(b.a,'uz')||a.t.localeCompare(b.t,'uz'),free:(a,b)=>(a.st==='out')-(b.st==='out')||a.c.localeCompare(b.c),new:(a,b)=>(b.added||'').localeCompare(a.added||'')||b.c.localeCompare(a.c)}[F.sort];
  R=R.slice().sort(cmp);
  $('#list').innerHTML=R.map(b=>`<button class="bk" data-c="${esc(b.c)}"><div class="top"><span class="code">${esc(b.c)}</span><span class="st ${b.st}">${b.st==='free'?'Javonda':'Berilgan'}</span></div><h3>${esc(b.t)}</h3>${b.a?`<p class="au">${esc(b.a)}</p>`:''}<div class="mt">${[b.cat,b.y,b.s?'Javon: '+b.s:''].filter(Boolean).map(esc).join(' · ')}</div>${b.st==='out'&&b.due?`<div class="mt">${dueTx(b)}</div>`:''}</button>`).join('')||`<div class="empty" style="grid-column:1/-1">${D.total?'Hech narsa topilmadi':'Hozircha kitoblar kiritilmagan'}</div>`;
  $('#upd').textContent='Yangilandi: '+new Date().toLocaleTimeString('uz',{hour:'2-digit',minute:'2-digit'})}
function show(c){const b=D&&D.books.find(x=>x.c===c);if(!b)return;
  const rows=[['Kod',b.c],['Muallif',b.a],['Janr',b.cat],['Yil',b.y],['Til',b.l],['Javon',b.s],['Izoh',b.n]].filter(r=>r[1]);
  $('#dlg').innerHTML=`<span class="st ${b.st}">${b.st==='free'?'✔ Javonda — olish mumkin':'Hozir berilgan'}</span><h2>${esc(b.t)}</h2>${b.st==='out'?`<p class="au" style="margin:4px 0">${b.since?'Berilgan sana: '+fd(b.since)+'. ':''}${b.due?dueTx(b)+'.':''}</p>`:''}<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>${b.d?`<p style="margin:0 0 8px">${esc(b.d)}</p>`:''}<button class="close" onclick="this.closest('dialog').close()">Yopish</button>`;
  $('#dlg').showModal()}
$('#list').onclick=e=>{const k=e.target.closest('.bk');if(k)show(k.dataset.c)};
$('#q').oninput=e=>{F.q=e.target.value;if(D)draw()};
$('#cat').onchange=e=>{F.cat=e.target.value;draw()};$('#srt').onchange=e=>{F.sort=e.target.value;draw()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;F.s=b.dataset.s;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));draw()};
$('#dlg').onclick=e=>{if(e.target.id==='dlg')e.target.close()};
function openHash(){const m=location.hash.match(/^#KT-(\d{3})$/i);if(m&&D)show('KT '+m[1])}
load().then(openHash);addEventListener('hashchange',openHash);
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
