<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nrm=s=>String(s||'').toLowerCase().replace(/[ʻʼ‘’'`]/g,'');
const fd=d=>d?d.split('-').reverse().join('.'):'';
const tdy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dueTx=b=>!b.due?'':b.due>=tdy()?'Qaytishi kutilmoqda: <b>'+fd(b.due)+'</b>':'Qaytish sanasi aniq emas';
const hue=c=>{let h=0;for(const ch of String(c))h=(h*31+ch.charCodeAt(0))%360;return h};
const ini=t=>String(t||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const calm=matchMedia('(prefers-reduced-motion:reduce)');
let D=null,first=true,F={q:'',s:'all',cat:'',sort:'code'};

function cnt(el,n){
  if(el.dataset.v==String(n))return;el.dataset.v=n;
  if(calm.matches){el.textContent=n;return}
  const a=+el.textContent||0,t0=performance.now();
  const step=t=>{const p=Math.min((t-t0)/1000,1);el.textContent=Math.round(a+(n-a)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step)}
async function load(){
  const slow=setTimeout(()=>{if(!D)$('#msg').textContent='Server uyg‘onmoqda… 1 daqiqagacha kutish mumkin'},6000);
  try{const r=await fetch('/api/public/books',{cache:'no-store'});if(!r.ok)throw 0;const was=D;D=await r.json();$('#msg').textContent='';draw(!was)}
  catch(e){if(!D){$('#list').innerHTML='';$('#msg').innerHTML='Katalog yuklanmadi. Internetni tekshirib, qayta urinib ko‘ring. <button onclick="load()">Qayta urinish</button>'}}
  clearTimeout(slow)}
function draw(anim){
  $('#ttl').textContent=D.name;document.title=D.name+' — katalog';
  const p=D.total?D.free/D.total:0;
  cnt($('#n1'),D.total);cnt($('#n2'),D.free);cnt($('#n3'),D.out);cnt($('#pc'),Math.round(p*100));
  $('#ring').setAttribute('stroke-dasharray',(p*163.4)+' 163.4');
  $('#c1').textContent=D.total;$('#c2').textContent=D.free;$('#c3').textContent=D.out;
  const sh=$('#shelf');sh.className=first?'go':'';
  sh.innerHTML=D.books.map((b,i)=>`<i class="${b.st}" style="--h:${hue(b.c)};--i:${i}" data-c="${esc(b.c)}" title="${esc(b.t)}"></i>`).join('');first=false;
  const cs=$('#cat'),cur=cs.value;cs.innerHTML='<option value="">Barcha janrlar</option>'+D.cats.map(c=>`<option>${esc(c)}</option>`).join('');cs.value=D.cats.includes(cur)?cur:'';F.cat=cs.value;
  const t=nrm(F.q);
  let R=D.books.filter(b=>(F.s==='all'||b.st===F.s)&&(!F.cat||b.cat===F.cat)&&(!t||nrm(b.t+' '+b.a+' '+b.cat+' '+b.c+' '+b.s).includes(t)));
  const cmp={code:(a,b)=>a.c.localeCompare(b.c),title:(a,b)=>a.t.localeCompare(b.t,'uz'),author:(a,b)=>a.a.localeCompare(b.a,'uz')||a.t.localeCompare(b.t,'uz'),free:(a,b)=>(a.st==='out')-(b.st==='out')||a.c.localeCompare(b.c),new:(a,b)=>(b.added||'').localeCompare(a.added||'')||b.c.localeCompare(a.c)}[F.sort];
  R=R.slice().sort(cmp);
  $('#rc').textContent=R.length+' ta kitob';$('#clr').hidden=!(F.q||F.s!=='all'||F.cat);
  const L=$('#list');
  L.innerHTML=R.map(b=>`<button class="bk ${b.st}" style="--h:${hue(b.c)}" data-c="${esc(b.c)}"><div class="cv"><span>${esc(ini(b.t))}</span></div><div class="bd"><div class="top"><span class="code">${esc(b.c)}</span><span class="st ${b.st}">${b.st==='free'?'Javonda':'Berilgan'}</span></div><h3>${esc(b.t)}</h3>${b.a?`<p class="au">${esc(b.a)}</p>`:''}<div class="tags">${[b.cat,b.y,b.s?'Javon: '+b.s:''].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>${b.st==='out'&&b.due?`<div class="due">${dueTx(b)}</div>`:''}</div></button>`).join('')||`<div class="empty">${D.total?'Hech narsa topilmadi. Boshqa so‘z yoki janr bilan qidirib ko‘ring.':'Hozircha kitoblar kiritilmagan.'}</div>`;
  if(anim&&io)L.querySelectorAll('.bk').forEach(el=>{el.classList.add('rv');io.observe(el)});
  $('#upd').textContent='Yangilandi: '+new Date().toLocaleTimeString('uz',{hour:'2-digit',minute:'2-digit'})}
function show(c){const b=D&&D.books.find(x=>x.c===c);if(!b)return;
  const rows=[['Kod',b.c],['Janr',b.cat],['Yil',b.y],['Til',b.l],['Javon',b.s],['Izoh',b.n]].filter(r=>r[1]);
  const d=$('#dlg');d.style.setProperty('--h',hue(b.c));
  d.innerHTML=`<div class="dh"><div class="cv lg" style="--h:${hue(b.c)}"><span>${esc(ini(b.t))}</span></div><div><span class="st ${b.st}">${b.st==='free'?'Javonda — olish mumkin':'Hozir berilgan'}</span><h2>${esc(b.t)}</h2>${b.a?`<p class="au">${esc(b.a)}</p>`:''}${b.st==='out'?`<p class="due">${b.since?'Berilgan sana: '+fd(b.since)+'. ':''}${b.due?dueTx(b)+'.':''}</p>`:''}</div></div><dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>${b.d?`<p style="margin:0 0 10px">${esc(b.d)}</p>`:''}<div class="acts"><button class="ghost" id="cp">Havolani nusxalash</button><button class="close" onclick="this.closest('dialog').close()">Yopish</button></div>`;
  $('#cp').onclick=async e=>{try{await navigator.clipboard.writeText(location.origin+'/kitoblar#'+c.replace(' ','-'));e.target.textContent='Nusxalandi ✓'}catch(x){e.target.textContent='Nusxalab bo‘lmadi'}};
  d.showModal()}

$('#cat').onchange=e=>{F.cat=e.target.value;draw(true)};$('#srt').onchange=e=>{F.sort=e.target.value;draw(true)};
function setChip(s){F.s=s;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.s===s))}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;setChip(b.dataset.s);draw(true)};
$('#clr').onclick=()=>{F.q='';F.cat='';$('#q').value='';$('#cat').value='';setChip('all');draw(true)};
$('#dlg').onclick=e=>{if(e.target.id==='dlg')e.target.close()};
$('#th').onclick=()=>{const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}};
addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
function openHash(){const m=location.hash.match(/^#KT-(\d{3})$/i);if(m&&D)show('KT '+m[1])}
load().then(openHash);addEventListener('hashchange',openHash);
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
