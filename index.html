 if(o)dlg(`<h2>${id} — qaytarib olish</h2><p class="auto">🕒 Qaytarish vaqti tugma bosilganda <b>avtomatik</b> yoziladi</p><p>Kimda: <b>${esc(o.person)}</b><br><span class="mut">${esc(o.purpose||'')} · ${o.date} ${o.t}</span></p>
  <label>Qaytgandagi holati</label><select id="f1">${CONDS.map(c=>`<option ${c===x.cond?'selected':''}>${c}</option>`).join('')}</select>
  <div class="acts"><button class="btn ghost" onclick="closeD()">Bekor</button><button class="btn ok" onclick="giveBack('${id}')">Qaytarib olindi</button></div>`);
 else dlg(`<h2>${id} — berish</h2><p class="auto">🕒 Berilish vaqti tugma bosilganda <b>avtomatik</b> yoziladi</p><label>Kimga (ro‘yxatdan tanlang)</label><select id="f1">${nopt('')}</select>${(S.persons||[]).some(p=>!p.resp)?'':'<p class="auto">⚠ Ro‘yxat bo‘sh. Avval “Ustozlar (QR bilan oladi)” bo‘limiga ism qo‘shing.</p>'}
  <label>Maqsad / sinf (ixtiyoriy)</label><input id="f2" placeholder="Masalan: 3-dars, 9-A sinf">
  <div class="acts"><button class="btn ghost" onclick="closeD()">Bekor</button><button class="btn" onclick="giveOut('${id}')">Berish</button></div>`)}
function giveOut(id){const p=f1.value.trim();if(!p){f1.focus();return}
 S.loans.push({id,no:docNo(today()),by:who(),person:p,purpose:f2.value.trim(),date:today(),t:nowT(),back:null,bdate:null});save();closeD();render();toast('✔ '+id+' — '+p+'ga berildi · '+nowT())}
function giveBack(id){const o=open(id);o.back=nowT();o.bdate=today();S.laptops.find(l=>l.id===id).cond=f1.value;save();closeD();render();toast('✔ '+id+' qaytarib olindi · '+o.back)}

function setF(id,k,v){const x=S.laptops.find(l=>l.id===id);x[k]=v.trim();save();render()}
function common(){
 const R=S.laptops.filter(x=>x.group==='room'),n=c=>R.filter(x=>x.cond===c).length;
 const sum=CONDS.map(c=>`<div class="card stat"><b>${n(c)}</b><span>${c}</span></div>`).join('');
 const rows=R.map(x=>`<tr><td><b>${x.id}</b></td>
 <td><select onchange="setF('${x.id}','model',this.value)">${mopt(x.model)}</select></td>
 <td><select onchange="setF('${x.id}','cond',this.value)">${CONDS.map(c=>`<option ${c===x.cond?'selected':''}>${c}</option>`).join('')}</select></td>
 <td><input value="${esc(x.note)}" placeholder="Izoh: nima nosoz, nima o‘zgargan…" onchange="setF('${x.id}','note',this.value)"></td></tr>`).join('');
 return`<h2>Umumiy noutbuklar — ${R.length} ta <button class="btn ghost sm keep" onclick="pdfCom()">📄 PDF</button></h2>${respBar()}
 <p class="mut" style="margin-top:-8px">Har bir noutbukning modeli, holati va izohini shu yerda kiriting. O‘zgarish avtomatik saqlanadi.</p>
 <div class="grid g4">${sum}</div>
 <div class="card tw" style="padding:6px;margin-top:12px"><table><tr><th style="width:80px">Raqam</th><th>Model</th><th style="width:180px">Holati</th><th>Izoh</th></tr>${rows}</table></div>`}
function staff(){
 const E=S.laptops.filter(x=>x.group==='emp');
 const cards=E.map(x=>`<div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="av">${x.holder?esc(x.holder.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()):'💻'}</div><b style="font-size:18px">${x.id}</b><span style="margin-left:auto">${condTag(x.cond)}</span></div>
 <div style="margin:10px 0"><div style="font-size:17px;font-weight:600">${x.holder?esc(x.holder):'<span class="mut">Hodim kiritilmagan</span>'}</div>
 <div class="mut">${esc(x.dept||'Bo‘lim kiritilmagan')}${x.pos?' · '+esc(x.pos):''}</div></div>
 <div class="mut" style="font-size:13px">${mtag(x.model)}<br>Berilgan sana: ${x.since||'—'}${x.note?'<br>Izoh: '+esc(x.note):''}</div>
 <div class="acts" style="justify-content:flex-start"><button class="btn ghost sm" onclick="editS('${x.id}')">✏ Kiritish / tahrirlash</button></div></div>`).join('');
 return`<h2>Hodimlarga berilgan noutbuklar — ${E.length} ta</h2>
 <p class="mut" style="margin-top:-8px">Har bir noutbuk qaysi bo‘limdagi qaysi hodimda ekanini qo‘lda kiriting.</p>
 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${cards||'<div class="card mut">Hodimlarga biriktirilgan noutbuk yo‘q. “Noutbuklar” bo‘limida joylashuvni o‘zgartiring.</div>'}</div>`}
function editS(id){const x=S.laptops.find(l=>l.id===id);
 dlg(`<h2>${id} — hodim ma’lumoti</h2>
 <label>Ism familiyasi (o‘qituvchi / hodim)</label><select id="f1">${nopt(x.holder,'resp')}</select>
 <label>Bo‘lim / fan</label><input id="f2" value="${esc(x.dept||'')}" placeholder="Masalan: Buxgalteriya">
 <label>Lavozimi</label><input id="f3" value="${esc(x.pos||'')}" placeholder="Masalan: Bosh buxgalter">
 <label>Berilgan sana</label><input type="date" id="f4" value="${x.since||''}">
 <label>Model</label><select id="f5">${mopt(x.model)}</select>
 <label>Holati</label><select id="f6">${CONDS.map(c=>`<option ${c===x.cond?'selected':''}>${c}</option>`).join('')}</select>
 <label>Izoh</label><textarea id="f7" rows="2">${esc(x.note)}</textarea>
 <div class="acts"><button class="btn er" onclick="clearS('${id}')">Qaytarib olish</button><button class="btn ghost" onclick="closeD()">Bekor</button><button class="btn" onclick="saveS('${id}')">Saqlash</button></div>`)}
function saveS(id){const x=S.laptops.find(l=>l.id===id);
 x.holder=f1.value.trim();x.dept=f2.value.trim();x.pos=f3.value.trim();x.since=f4.value;x.model=f5.value;x.cond=f6.value;x.note=f7.value.trim();save();closeD();render()}
function clearS(id){if(!confirm('Noutbuk hodimdan qaytarib olinsinmi?'))return;const x=S.laptops.find(l=>l.id===id);x.holder='';x.dept='';x.pos='';x.since='';save();closeD();render()}
function rep(){
 const d=S.loans.filter(l=>l.date===repDate),ret=d.filter(l=>l.back).length,saved=S.reports.find(r=>r.date===repDate);
 const rows=d.map(l=>`<tr><td><b>${l.id}</b></td><td>${esc(l.person)}</td><td>${esc(l.purpose||'—')}</td><td>${l.t}</td><td>${l.back?l.back:'—'}</td><td>${l.back?'<span class="tag t-ok">Qaytgan</span>':'<span class="tag t-er">Qaytmagan</span>'}</td><td class="docno">${l.no||''}</td></tr>`).join('');
 const hist=S.reports.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(r=>`<tr><td>${r.date}</td><td>${r.given}</td><td>${r.ret}</td><td class="mut">${esc(r.note||'')}</td></tr>`).join('');
 return`<h2>Kunlik hisobot</h2><div class="row noprint"><input type="date" id="rd" value="${repDate}" onchange="repDate=this.value;render()"><button class="btn ghost keep" onclick="window.print()">🖨 PDF / Chop etish</button><button class="btn keep" onclick="pdfDay()">📄 Kunlik PDF</button><button class="btn ghost keep" onclick="pdfMonth()">📄 Oylik PDF</button><button class="btn ghost keep" onclick="csvDay()">📊 Excel (kun)</button><button class="btn ghost keep" onclick="csvMonth()">📊 Excel (oy)</button></div>
 <div class="grid g4"><div class="card stat"><b>${d.length}</b><span>Berilgan</span></div><div class="card stat"><b style="color:var(--ok)">${ret}</b><span>Qaytgan</span></div><div class="card stat"><b style="color:var(--er)">${d.length-ret}</b><span>Qaytmagan</span></div></div>
 <div class="card tw" style="margin-top:12px;padding:6px"><table><tr><th>NP</th><th>Kimga</th><th>Maqsad</th><th>Berildi</th><th>Qaytdi</th><th>Holat</th><th>Hujjat №</th></tr>${rows||'<tr><td colspan="7" class="mut">Bu kunda yozuv yo‘q</td></tr>'}</table></div>
 <div class="card" style="margin-top:12px"><label style="margin-top:0">Mas’ul shaxs izohi (kun yakuni)</label><textarea id="rn" rows="3" placeholder="Nosozliklar, kechikishlar, eslatmalar…">${esc(saved?saved.note:'')}</textarea>
 <div class="acts noprint"><button class="btn" onclick="saveRep()">${saved?'Hisobotni yangilash':'Hisobotni saqlash'}</button></div></div>
 <h2 style="margin-top:22px;font-size:16px">Saqlangan hisobotlar</h2><div class="card tw" style="padding:6px"><table><tr><th>Sana</th><th>Berilgan</th><th>Qaytgan</th><th>Izoh</th></tr>${hist||'<tr><td colspan="4" class="mut">Hali yo‘q</td></tr>'}</table></div>`}
function saveRep(){const d=S.loans.filter(l=>l.date===repDate);const r={date:repDate,given:d.length,ret:d.filter(l=>l.back).length,note:rn.value.trim(),by:S.resp};
 S.reports=S.reports.filter(x=>x.date!==repDate);S.reports.push(r);save();render();toast('✔ Hisobot saqlandi')}

function set(){return`<h2>Sozlamalar</h2><div class="two"><div class="card"><label style="margin-top:0">Mas’ul shaxs (NP 01–NP 23, NP 19 dan tashqari)</label><input id="s0" value="${esc(S.resp)}">
 <label>1-o‘qituvchi (10 ta noutbuk)</label><input id="s1" value="${esc(S.names.t1)}"><label>2-o‘qituvchi (4 ta noutbuk)</label><input id="s2" value="${esc(S.names.t2)}">
 <div class="acts"><button class="btn" onclick="saveSet()">Saqlash</button></div></div>
 <div class="card"><b>🔐 Login va parolni o‘zgartirish</b><label>Joriy parol</label><input id="a0" type="password" autocomplete="current-password"><label>Login</label><input id="a1" value="${esc(me||'admin')}" autocomplete="username"><label>Yangi parol (kamida 6 belgi; o‘zgarmasa bo‘sh qoldiring)</label><input id="a2" type="password" autocomplete="new-password"><label>Yangi parolni takrorlang</label><input id="a3" type="password" autocomplete="new-password"><div class="acts"><button class="btn" onclick="saveAuth()">Yangilash</button></div></div>
 <div class="card"><b>Zaxira nusxa</b><p class="mut">Ma’lumotlar serverda saqlanadi va barcha qurilmalarda bir xil. Baribir ba’zan zaxira nusxa oling.</p>
 <div class="acts" style="justify-content:flex-start"><button class="btn ghost keep" onclick="exp()">⬇ Zaxira</button><button class="btn ghost keep" onclick="csvAll()">📊 Excel (barcha)</button><button class="btn ghost" onclick="document.getElementById('imp').click()">⬆ Yuklash</button><input type="file" id="imp" class="hide" accept=".json" onchange="imp(this)"></div>
 <div style="margin-top:14px"><button class="btn ghost sm" onclick="bakList()">🗄 Server zaxiralari (oxirgi 14 kun)</button><div id="bakl" class="mut" style="margin-top:8px"></div></div>
 <button class="btn er sm" style="margin-top:14px" onclick="if(prompt('BARCHA ma’lumot o‘chadi. Tasdiqlash uchun OCHIRISH deb yozing')==='OCHIRISH'){S=init();save();render()}">Boshlang‘ich holatga qaytarish</button></div></div>`}
function saveSet(){S.resp=s0.value.trim();S.names.t1=s1.value.trim()||'1-o‘qituvchi';S.names.t2=s2.value.trim()||'2-o‘qituvchi';save();toast('✔ Saqlandi')}
async function bakList(){const b=document.getElementById('bakl');b.textContent='Yuklanmoqda…';try{const j=await api('GET','/api/backups');b.innerHTML=j.days.length?j.days.slice().reverse().map(d=>`<div style="margin:4px 0"><b>${d}</b> · <a href="/api/backup?d=${d}&k=nb" download>Noutbuk</a> · <a href="/api/backup?d=${d}&k=lib" download>Kutubxona</a></div>`).join('')+'<div style="font-size:12px;margin-top:6px">Fayl “⬆ Yuklash” tugmasi bilan qaytariladi.</div>':'Hozircha zaxira yo‘q (server har soatda tekshiradi).'}catch(e){b.textContent='⚠ Olib bo‘lmadi'}}
function exp(){dlRaw('noutbuk-zaxira-'+today()+'.json',JSON.stringify(S))}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.laptops)throw 0;d.loans=d.loans||[];d.hist=d.hist||[];d.repairs=d.repairs||[];d.reports=d.reports||[];d.persons=d.persons||[];d.names=d.names||{t1:'1-o‘qituvchi',t2:'2-o‘qituvchi'};S=d;migResp();save();render();toast('✔ Zaxira yuklandi')}catch(e){toast('⚠ Fayl noto‘g‘ri')}};r.readAsText(f)}

function dlg(h){if(!canW){toast('Faqat ko‘rish rejimi');return}const d=document.getElementById('dlg');d.innerHTML=h;d.showModal()}
function closeD(){scanStop();document.getElementById('dlg').close()}
const IC={mas:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',list:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',room:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',common:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>',staff:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',ust:'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M17 11l2 2 4-4"/>',qr:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',hist:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',day:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',repair:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',rep:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',lib:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'};
document.querySelectorAll('#nav button').forEach(b=>b.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 24 24">'+(IC[b.dataset.t]||'')+'</svg>'));applyTheme();
load();migResp();loadLib();render();tick();setInterval(tick,1000);boot();document.getElementById('dlg').addEventListener('close',scanStop);window.addEventListener('hashchange',()=>{if(!document.body.classList.contains('lock'))hashGo()});
setTimeout(()=>{if(!window.jsQR&&!('BarcodeDetector' in window))loadJsQR()},3000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
